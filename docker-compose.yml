x-temporal-db-env: &temporal-db-env
  DB: postgres12
  DB_PORT: 5432
  POSTGRES_USER: temporal
  POSTGRES_PWD: temporal
  POSTGRES_SEEDS: postgresql

x-app-env: &app-env
  NODE_ENV: production
  LOG_LEVEL: info
  REDIS_URL: redis://redis:6379
  TEMPORAL_ADDRESS: temporal:7233
  TEMPORAL_NAMESPACE: default
  TEMPORAL_TASK_QUEUE: hotel-offers
  SUPPLIER_A_URL: http://api:3000/supplierA/hotels
  SUPPLIER_B_URL: http://api:3000/supplierB/hotels

services:
  api:
    build: .
    image: hotel-offer-orchestrator:local
    environment:
      <<: *app-env
      PORT: 3000
      ENABLE_MOCK_SUPPLIERS: 'true'
    ports:
      - '3000:3000'
    depends_on:
      redis:
        condition: service_healthy
      temporal-create-namespace:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://localhost:3000/livez').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
      interval: 10s
      timeout: 3s
      start_period: 10s
      retries: 5

  worker:
    # Same image as api (built once there); never pulled from a registry.
    image: hotel-offer-orchestrator:local
    pull_policy: never
    command: ['node', 'dist/temporal/worker.js']
    environment: *app-env
    depends_on:
      api:
        condition: service_healthy
      redis:
        condition: service_healthy
      temporal-create-namespace:
        condition: service_completed_successfully

  redis:
    image: redis:8.10.2
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20

  postgresql:
    image: postgres:16.15
    environment:
      POSTGRES_USER: temporal
      POSTGRES_PASSWORD: temporal
    volumes:
      - temporal-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U temporal']
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 30s

  temporal-admin-tools:
    image: temporalio/admin-tools:1.31.4
    restart: on-failure:6
    depends_on:
      postgresql:
        condition: service_healthy
    environment:
      <<: *temporal-db-env
      SQL_PASSWORD: temporal
    volumes:
      - ./docker/temporal/scripts:/scripts:ro
    entrypoint: ['/bin/sh']
    command: /scripts/setup-postgres.sh

  temporal:
    image: temporalio/server:1.31.4
    depends_on:
      temporal-admin-tools:
        condition: service_completed_successfully
    environment:
      <<: *temporal-db-env
      BIND_ON_IP: 0.0.0.0
      DYNAMIC_CONFIG_FILE_PATH: config/dynamicconfig/development-sql.yaml
    ports:
      - '7233:7233'
    volumes:
      - ./docker/temporal/dynamicconfig:/etc/temporal/config/dynamicconfig:ro
    healthcheck:
      test: ['CMD', 'nc', '-z', 'localhost', '7233']
      interval: 5s
      timeout: 3s
      start_period: 30s
      retries: 60

  temporal-create-namespace:
    image: temporalio/admin-tools:1.31.4
    restart: on-failure:5
    depends_on:
      temporal:
        condition: service_healthy
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      DEFAULT_NAMESPACE: default
    volumes:
      - ./docker/temporal/scripts:/scripts:ro
    entrypoint: ['/bin/sh']
    command: /scripts/create-namespace.sh

  temporal-ui:
    image: temporalio/ui:2.49.1
    depends_on:
      temporal:
        condition: service_healthy
    environment:
      TEMPORAL_ADDRESS: temporal:7233
    ports:
      - '8080:8080'

volumes:
  temporal-postgres:
